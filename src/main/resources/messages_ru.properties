help.title=📖 WildLiveBot — Список команд
help.description=Вот всё, что вы можете делать:
help.section.playing=🎯 Игровой процесс
help.section.playing_body=`/catch` — Вызвать животное для угадывания (есть кулдаун)\nНапишите название животного в чат, чтобы поймать его — попробовать может любой!
help.section.collection=🎒 Ваш прогресс
help.section.collection_body=`/profile` — Ваш счёт, ранг и достижения\n`/collection` — Просмотр всех пойманных животных\n`/favorite` — Выбрать любимое пойманное животное\n`/leaderboard` — Топ охотников на сервере\n`/achievements` — Все достижения и ваш прогресс
help.section.shop=🏪 Магазин
help.section.shop_body=`/shop` — Просмотр приманок и инструментов\n`/buy` — Купить приманку для биома или Небесный Фотоаппарат\n`/use` — Активировать приманку в текущем канале
help.section.quests=📜 Еженедельные квесты
help.section.quests_body=`/quests view` — Проверить прогресс еженедельных квестов\n`/quests claim` — Забрать награду, когда все квесты выполнены
help.section.admin=🔧 Только для администраторов
help.section.admin_body=`/setup-channel` — Выбрать канал для появления животных\n`/config view` / `/config set` — Настроить баланс игры
help.footer=Удачной охоты! 🌿