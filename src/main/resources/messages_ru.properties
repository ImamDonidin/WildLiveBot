game.hint.seal_not_sealion=❌ Это не тюлень. Обрати внимание на уши и форму передних ласт.
game.hint.seal_not_walrus=❌ Это не тюлень! Эти животные гораздо крупнее и у них огромные бивни.
game.hint.rabbit_not_hare=❌ Это не кролик. Он заметно крупнее, быстрее и имеет длинные уши с чёрными кончиками.
game.hint.bison_not_wisent=❌ Это не европейский зубр. Обрати внимание, в каком биоме обитает это животное.
game.hint.warthog_not_boar=❌ Это не кабан. Обрати внимание на характерные наросты на морде и место обитания.
game.hint.pig_generic=❌ Недостаточно точно. Назови конкретный вид этого представителя семейства свиных.
game.hint.boar_not_warthog=❌ Это не бородавочник. Подумай, какой представитель свиных живёт в европейских лесах.
game.hint.tortoise_not_pond=❌ Это не болотная черепаха. Она приспособлена к жизни исключительно на суше.
game.hint.tortoise_not_sea=❌ Это не морская черепаха. Обрати внимание на лапы — у неё нет ласт.
game.hint.wolverine_not_badger=❌ Это не барсук! Он гораздо крупнее, сильнее и известен своим бесстрашием.
game.hint.cougar_not_panther=❌ Это не пантера! Обрати внимание на однотонную светло-рыжую окраску и длинный хвост.
game.hint.cougar_not_lion=❌ Это не лев! У него нет гривы, а живёт он вовсе не в саваннах.
game.hint.wisent_not_bison=❌ Это не американский бизон! Обрати внимание на регион обитания — это его европейский родственник.
game.hint.raven_not_crow=❌ Это не ворона! Он заметно крупнее, с массивным клювом и клиновидным хвостом.
game.hint.ostrich_not_emu=❌ Это не эму! Обрати внимание на длинную голую шею, два пальца на ногах и чёрно-белое оперение самца.
game.hint.swallow_not_swift=❌ Это не стриж! Обрати внимание на глубоко раздвоенный хвост — они часто сидят на проводах, а стрижи почти всю жизнь проводят в полёте.
game.hint.antelope_generic=❌ Недостаточно точно. Назови конкретный вид антилопы.
game.hint.stoat_not_weasel=❌ Это не ласка! Обрати внимание на чёрный кончик хвоста — это главный признак животного.
game.hint.parrot_generic=❌ Недостаточно точно. Назови конкретный вид попугая.
game.hint.caracal_not_bigfloppa=❌ Да, это знаменитый Шлёпа. Но назови конкретный вид животного.
game.hint.cat_generic=❌ Недостаточно точно. Назовите конкретный вид кошки.
game.hint.cheetah_not_leopard=❌ Это не леопард! Обрати внимание на стройное тело, чёрные «слёзные полосы» на морде и длинные ноги.
game.hint.anteater_not_ant=❌ Это не муравей! Попробуй назвать животное, которое питается муравьями.

