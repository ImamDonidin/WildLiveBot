welcome.title=🐾 Thanks for adding WildLiveBot!
welcome.description=WildLiveBot turns your server into a wildlife hunting ground — animals spawn at random, and the first person to type their name in chat catches them!
welcome.setup_title=🔧 Getting Started
welcome.setup_body=An administrator needs to run `/setup-channel` first to choose where animals will spawn.
welcome.help_title=📖 Need a hand?
welcome.help_body=Run `/help` anytime to see the full list of commands.
welcome.footer=Good luck, naturalist! 🌿

help.title=📖 WildLiveBot — Command Guide
help.description=Here's everything you can do:
help.section.playing=🎯 Playing
help.section.playing_body=`/catch` — Spawn an animal to guess (respects a cooldown)\nType the animal's name in chat to catch it — anyone can try!
help.section.collection=🎒 Your Progress
help.section.collection_body=`/profile` — View your score, rank, and achievements\n`/collection` — Browse every animal you've caught\n`/favorite` — Set your favorite caught animal\n`/leaderboard` — See the top hunters on this server\n`/achievements` — View all achievements and your progress
help.section.shop=🏪 Shop
help.section.shop_body=`/shop` — Browse baits and tools\n`/buy` — Purchase a biome bait or the Sky Camera\n`/use` — Activate a bait in the current channel
help.section.quests=📜 Weekly Quests
help.section.quests_body=`/quests view` — Check your weekly quest progress\n`/quests claim` — Claim your reward once all quests are done
help.section.admin=🔧 Admin Only
help.section.admin_body=`/setup-channel` — Choose the channel where animals spawn\n`/config view` / `/config set` — Adjust game balance settings
help.footer=Happy hunting! 🌿