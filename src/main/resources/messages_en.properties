game.hint.seal_not_sealion=❌ This isn't a seal! Look closer at the ears and flippers.
game.hint.seal_not_walrus=❌ This isn't a seal! These animals are much larger and have massive tusks.
game.hint.rabbit_not_hare=❌ This isn't a rabbit! Hares are larger, have longer ears with black tips, and run much faster.
game.hint.bison_not_wisent=❌ This isn't a European bison! Check the habitat—it's its North American relative.
game.hint.warthog_not_boar=❌ This isn't a wild boar! It's its African relative with distinctive facial warts.
game.hint.pig_generic=❌ Too generic! Name the exact wild member of the pig family.
game.hint.boar_not_warthog=❌ This isn't a warthog! It's the classic wild boar of Eurasian forests.
game.hint.tortoise_not_pond=❌ This isn't a pond turtle! It lives only on land, and deep water is dangerous for it.
game.hint.tortoise_not_sea=❌ This isn't a sea turtle! It has legs instead of flippers and lives on land.
game.hint.wolverine_not_badger=❌ This isn't a badger! It's much larger, far stronger, and famous for its fearlessness.
game.hint.cougar_not_panther=❌ This isn't a black panther! Look at its solid tan coat instead.
game.hint.cougar_not_lion=❌ This isn't a lion! It has no mane and doesn't live in the savanna.
game.hint.wisent_not_bison=❌ This isn't an American bison! Check the habitat—it's the European relative.
game.hint.raven_not_crow=❌ This isn't a crow! It's much larger, with a heavier bill and a wedge-shaped tail.
game.hint.ostrich_not_emu=❌ This isn't an emu! Ostriches have only two toes on each foot, while emus have three.
game.hint.swallow_not_swift=❌ This isn't a swift! Notice the deeply forked tail—they often perch on power lines, while swifts spend almost their entire lives in flight.
game.hint.antelope_generic=❌ Too generic! Name the exact species of antelope.
game.hint.stoat_not_weasel=❌ This isn't a weasel! Look at the black tip of its tail—that's the animal's defining feature.
game.hint.parrot_generic=❌ Too generic! Name the exact species of parrot.
game.hint.caracal_not_bigfloppa=❌ Yes, that's the famous Big Floppa. But name the exact species of animal.
game.hint.cat_generic=❌ Too generic! Name the exact species of cat.
game.hint.cheetah_not_leopard=❌ This isn't a leopard! Notice its slender body, the black “tear streaks” on its face, and its long legs.
game.hint.anteater_not_ant=❌ This isn't an ant! Try to name an animal that eats ants.

